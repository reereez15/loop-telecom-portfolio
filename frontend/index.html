<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>L∞P 루프 고객센터</title>
    <script>
      // 화면을 그리기 전에 테마를 정해 흰 화면 깜빡임을 막는다 (utils/theme.ts 와 같은 규칙). 기본값은 light.
      (function () {
        var pref = 'light';
        try { var v = localStorage.getItem('loop-theme'); if (v === 'dark') pref = 'dark'; } catch (e) {}
        document.documentElement.dataset.theme = pref;
        document.documentElement.dataset.themePref = pref;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
