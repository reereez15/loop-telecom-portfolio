# 관제 스택(Graylog 6.1 + n8n) 한 PC 재현용 — 김준식 정리
# 학원에서는 Graylog=PC1, n8n·Wazuh=PC2 의 Docker 에서 따로 돌았고, 실행 정의(compose)가 저장소에 없었다.
# 이 파일은 그 구성을 내 PC 한 대에서 다시 띄우기 위한 것이다.
#
# 순서: 먼저 앱(local compose)을 띄워 'telecom-local_default' 네트워크를 만든 뒤 저장소 루트에서
#   docker compose -f monitoring/compose/monitoring.compose.yaml --env-file .env up -d
# 접속: Graylog http://localhost:9000 (admin / 내가 정한 비밀번호) · n8n http://localhost:5678
name: telecom-monitoring

services:
  mongodb:
    image: mongo:6.0
    volumes: [mongo_data:/data/db]
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      action.auto_create_index: "false"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes: [os_data:/usr/share/opensearch/data]
    restart: unless-stopped

  graylog:
    image: graylog/graylog:6.1
    depends_on: [mongodb, opensearch]
    entrypoint: /usr/bin/tini -- wait-for-it opensearch:9200 -- /docker-entrypoint.sh
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?set in .env}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?set in .env}
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9000/
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ROOT_TIMEZONE: Asia/Seoul
    ports:
      - 127.0.0.1:9000:9000        # 웹 UI
      - 127.0.0.1:12201:12201/udp  # GELF UDP (앱·시험 스크립트 → Graylog)
      - 127.0.0.1:1514:1514/udp    # Syslog UDP (pfSense 등, 선택)
    volumes: [graylog_data:/usr/share/graylog/data]
    networks: [default, app]
    restart: unless-stopped

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:1.64.0}
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run prepare-local.py}
      GENERIC_TIMEZONE: Asia/Seoul
      N8N_SECURE_COOKIE: "false"   # http://localhost 접속용
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"  # 워크플로가 {{$env.…}} 로 비밀값을 읽게 한다 (JSON 에 비밀값을 넣지 않기 위해)
      AUTOMATION_API_TOKEN: ${AUTOMATION_API_TOKEN:-${INCIDENT_API_TOKEN}}
      INCIDENT_API_TOKEN: ${INCIDENT_API_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - 127.0.0.1:5678:5678
    volumes: [n8n_data:/home/node/.n8n]
    networks: [default, app]
    restart: unless-stopped

networks:
  app:
    external: true
    name: telecom-local_default   # 앱 compose 가 만든 네트워크 → n8n 이 api:5000 으로 바로 호출

volumes:
  mongo_data:
  os_data:
  graylog_data:
  n8n_data:
