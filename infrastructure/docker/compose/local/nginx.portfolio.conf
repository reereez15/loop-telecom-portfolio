# 포트폴리오 로컬 재현용 고객 입구(8443) 설정 — 김준식
# 원본: 팀 nginx.conf (같은 폴더, 그대로 둠). compose.portfolio.yaml 이 원본 대신 이 파일을 edge 에 붙인다.
# 원본과 다른 점 2가지:
#  1) proxy_set_header Host $http_host — 포트(:8443)까지 넘겨야 Flask 의 같은 출처(Origin) 검사가 통과 (원본 $host 는 브라우저 로그인 403)
#  2) location / 에 화면용 보안 헤더 4종 (API 응답 헤더는 Flask backend/app/core/security_headers.py)

server {
    listen 80;
    server_name _;
    return 308 https://portal.telecom.test:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.telecom.test localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $http_host;  # 포트(:8443/:8444)까지 넘겨야 Flask 의 같은 출처(Origin) 검사가 통과한다
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }

    location / {
        proxy_pass http://web:80;
        # 화면(정적 파일)용 보안 헤더. API 응답은 Flask 가 같은 헤더를 붙인다(backend/app/core/security_headers.py)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_set_header Host $http_host;  # 포트(:8443/:8444)까지 넘겨야 Flask 의 같은 출처(Origin) 검사가 통과한다
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
