# 관리자 전용 입구 (127.0.0.1:8444). 고객용 8443 과 달리 /admin, /api/admin 을 통과시킨다.
# /api/internal 은 로컬 시나리오 재현(scripts/scenario_bruteforce.py --admin-url)을 위해서만 연다.
# 실제 학원망에서는 n8n 이 API 에 직접 붙고, 이 경로는 외부에 열지 않았다.
server {
    listen 443 ssl;
    server_name manage1.telecom.test localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $http_host;  # 포트(:8443/:8444)까지 넘겨야 Flask 의 같은 출처(Origin) 검사가 통과한다
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
    location / {
        proxy_pass http://web:80;
        # 화면(정적 파일)용 보안 헤더. API 응답은 Flask 가 같은 헤더를 붙인다(backend/app/core/security_headers.py)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_set_header Host $http_host;  # 포트(:8443/:8444)까지 넘겨야 Flask 의 같은 출처(Origin) 검사가 통과한다
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
