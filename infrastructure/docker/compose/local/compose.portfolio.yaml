# 개인 포트폴리오용 덧씌우기(override) — 김준식
# 팀 compose.yaml 은 그대로 두고, 새 PC에서 혼자 재현할 때 빠져 있던 것만 더한다.
#   docker compose -f compose.yaml -f compose.portfolio.yaml --env-file ../../../../.env --profile app up -d --build
# 1) api 에 자동화 토큰·관리자 허용 목록·Graylog 주소를 넘긴다 (팀 파일에는 DB 값만 넘어감)
# 2) 관리자 화면 전용 입구(127.0.0.1:8444)를 따로 둔다. 8443(고객용)은 팀 설정대로 /admin·/api/admin 을 막는다.
# 3) migrate 컨테이너에 시드 폴더를 붙여 'flask seed' 를 실행할 수 있게 한다 (팀 이미지는 seed 폴더를 복사하지 않음)
services:
  api:
    environment:
      INCIDENT_API_TOKEN: ${INCIDENT_API_TOKEN:?run prepare-local.py}
      AUTOMATION_API_TOKEN: ${AUTOMATION_API_TOKEN:-}
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST:-admin@test.local}
      GRAYLOG_GELF_HOST: ${GRAYLOG_GELF_HOST:-}
      GRAYLOG_GELF_PORT: ${GRAYLOG_GELF_PORT:-12201}
      KAKAOPAY_SECRET_KEY: ${KAKAOPAY_SECRET_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://portal.telecom.test:8443}
      # 로그인 실패 제한 창(분). 시나리오 재현을 짧게 하려면 .env 에 LOGIN_WINDOW_MINUTES=1
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}

  admin-edge:
    profiles: [app]
    image: ${NGINX_IMAGE:-nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}
    ports:
      - 127.0.0.1:8444:443   # 내 PC 안에서만 열린다 (학원망의 '관리자=내부망·VPN' 정책을 흉내)
    volumes:
      - {type: bind, source: ./nginx-admin.conf, target: /etc/nginx/conf.d/default.conf, read_only: true}
      - {type: bind, source: ../../../../.secrets/tls/server.crt, target: /etc/nginx/tls/server.crt, read_only: true}
      - {type: bind, source: ../../../../.secrets/tls/server.key, target: /etc/nginx/tls/server.key, read_only: true}
    depends_on: [web, api]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  migrate:
    volumes:
      - {type: bind, source: ../../../../database/seed, target: /workspace/database/seed, read_only: true}
